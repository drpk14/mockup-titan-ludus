<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>Reservas · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root, :root[data-theme="dark"] {
  --bg: #111113; --surface: #1A1A1D; --surface2: #232327; --border: #303036; --field: #3A3A41;
  --text: #EDEDED; --strong: #FFFFFF; --muted: #A6A6AD; --faint: #8C8C93;
  --accent: #C81E1E; --accent-hover: #A91818; --accent-text: #FF6B5E; --warn: #F5A524;
  --bjj: #4C8DF6; --grappling: #2FB39A; --mma: #A07CF7; --kids: #8FB8FF;
  --off: #4A4A52; --belt-edge: #303036; --shadow: rgba(0,0,0,.5); --toast-line: #D6D6D0;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F4F4F1; --surface: #FFFFFF; --surface2: #EEEEEA; --border: #D6D6D0; --field: #C9C9C2;
  --text: #1A1A1C; --strong: #0A0A0A; --muted: #55555B; --faint: #66666C;
  --accent: #C81E1E; --accent-hover: #A91818; --accent-text: #B3191B; --warn: #B45309;
  --bjj: #1D5FD1; --grappling: #0F7A66; --mma: #6B3FD6; --kids: #4A86E8;
  --off: #B9B9B3; --belt-edge: #BDBDB6; --shadow: rgba(0,0,0,.18); --toast-line: #3A3A3A;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--strong); outline-offset: 2px; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { position: relative; max-width: 480px; min-height: 100dvh; margin: 0 auto; background: var(--bg); }
@media (min-width: 520px) { .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
.view { display: flex; flex-direction: column; gap: 20px; padding: calc(20px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)); }
.view--sub { gap: 0; padding: env(safe-area-inset-top) 0 0; min-height: 100dvh; }
.sub-body { display: flex; flex-direction: column; gap: 20px; padding: 20px 16px 28px; flex: 1 1 auto; }

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--faint); color: var(--muted); font-size: 9px; }
.gym { font-size: 15px; font-weight: 700; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-weight: 700; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--sm { width: 36px; height: 36px; font-size: 13px; }
.avatar--md { width: 44px; height: 44px; font-size: 14px; }
.avatar--lg { width: 76px; height: 76px; font-size: 24px; font-weight: 800; }
.avatar-btn { padding: 0; background: none; border: none; border-radius: 50%; }

/* Titles */
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; color: var(--strong); line-height: 1.05; }
.subtitle { margin-top: 4px; font-size: 14px; color: var(--muted); }
.label { margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--strong); }

/* Buttons */
.iconbtn { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn--bare { border: none; background: transparent; }
.btn { min-height: 44px; padding: 0 16px; border: none; background: var(--accent); color: #FFFFFF; font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); }
.btn--outline { background: transparent; color: var(--text); border: 1px solid var(--text); }
.btn--outline:hover { background: var(--surface2); }
.btn--block { width: 100%; min-height: 48px; font-size: 15px; }
.btn--big { width: 100%; min-height: 52px; font-size: 16px; }
.linkbtn { min-height: 32px; padding: 0; border: none; background: transparent; color: var(--accent-text); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn--muted { color: var(--muted); font-weight: 500; }

/* Profile combo */
.combo-wrap { position: relative; }
.combo { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1px solid var(--border); background: var(--surface); text-align: left; }
.combo[aria-expanded="true"] { border-color: var(--strong); }
.combo-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.combo-txt b { font-size: 15px; color: var(--strong); }
.combo-txt span { font-size: 13px; color: var(--muted); }
.chev { flex: none; color: var(--muted); transition: transform .15s; }
.combo[aria-expanded="true"] .chev { transform: rotate(180deg); }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--strong); box-shadow: 0 12px 28px var(--shadow); }
.opt { min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: none; background: transparent; text-align: left; }
.opt + .opt { border-top: 1px solid var(--border); }
.opt[aria-selected="true"] { background: var(--surface2); }
.opt .check { color: var(--strong); visibility: hidden; }
.opt[aria-selected="true"] .check { visibility: visible; }

/* Banner */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; background: var(--surface2); border: 1px solid var(--border); }
.banner-txt { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.banner-txt b { font-size: 14px; color: var(--strong); }
.banner-txt span { font-size: 13px; color: var(--muted); }

/* Day strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.day .dl { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; }
.day .dn { font-size: 18px; font-weight: 700; }
.day.is-past { background: transparent; color: var(--faint); }
.day.is-today { border: 2px solid var(--strong); color: var(--strong); }
.day.is-sel { border: 1px solid var(--strong); background: var(--strong); color: var(--bg); }
.mark { width: 6px; height: 6px; }
.mark--booked { border-radius: 50%; background: var(--accent); }
.mark--att { background: currentColor; }
.mark--off { width: 10px; height: 2px; background: currentColor; }

/* Day card + rows */
.daycard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); touch-action: pan-y; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.badge { padding: 4px 8px; border: 1px solid var(--accent-text); color: var(--accent-text); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.hint { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface2); font-size: 13px; line-height: 1.4; color: var(--muted); }
.empty { padding: 32px 16px; border-top: 1px solid var(--border); text-align: center; font-size: 15px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--border); }
.row--hl { background: var(--surface2); }
.row-time { width: 52px; flex: none; display: flex; flex-direction: column; gap: 2px; }
.row-time .t1 { font-size: 18px; font-weight: 700; color: var(--strong); }
.row-time .t2 { font-size: 13px; color: var(--faint); }
.row-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-name { display: flex; align-items: center; gap: 7px; }
.row-name .nm { font-size: 16px; font-weight: 700; color: var(--strong); }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--c); }
.meta { font-size: 13px; color: var(--muted); }
.cap { font-size: 13px; color: var(--faint); }
.cap--low { font-weight: 600; color: var(--warn); }
.is-off { color: var(--faint) !important; }
.is-strike { text-decoration: line-through; }
.row-act { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.done { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--strong); }
.chip { min-height: 32px; display: inline-flex; align-items: center; padding: 0 10px; background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 600; }
.small { font-size: 12px; color: var(--faint); }
.muted-txt { font-size: 14px; color: var(--muted); }

/* Cards & lists */
.card { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--border); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); }
.li { min-height: 64px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: none; background: transparent; text-align: left; }
.li + .li { border-top: 1px solid var(--border); }
.li-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.li-txt b { font-size: 16px; font-weight: 600; color: var(--strong); }
.li-txt span { font-size: 13px; color: var(--muted); }
.li .go { flex: none; color: var(--faint); }
.addcircle { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px dashed var(--faint); color: var(--accent-text); }

/* Progress */
.car-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.car { display: flex; align-items: stretch; gap: 12px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car > article { flex: 0 0 calc(100% - 44px); scroll-snap-align: start; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--border); }
.car--single > article { flex-basis: 100%; }
.disc-name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; color: var(--strong); }
.disc-name .dot { width: 10px; height: 10px; }
.belt { height: 40px; display: flex; border: 1px solid var(--belt-edge); }
.belt .b1 { flex: 1 1 auto; background: var(--belt); }
.belt .tip { width: 108px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #111111; }
.belt .b2 { width: 18px; background: var(--belt); }
.stripe { width: 8px; height: 26px; border: 1px solid #6A6A6A; }
.stripe--on { background: #F4F4F2; border-color: #F4F4F2; }
.belt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.belt-row b { font-size: 19px; font-weight: 800; color: var(--strong); }
.bar { height: 8px; background: var(--surface2); }
.bar > span { display: block; height: 8px; background: var(--strong); }
.pips { display: flex; justify-content: center; gap: 6px; }
.pip { width: 6px; height: 6px; background: var(--faint); transition: width .15s; }
.pip--on { width: 18px; background: var(--strong); }
.big-n { font-size: 40px; font-weight: 800; color: var(--strong); line-height: 1; }
.hist { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
.hist-badge { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--surface2); color: var(--c); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; }
.hist-date { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; }
.col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col .v { min-height: 14px; font-size: 11px; font-weight: 700; color: var(--muted); }
.col .area { height: 110px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.col .bar-v { width: 14px; background: var(--strong); }
.col .bar-v--zero { height: 4px; background: var(--surface2); }
.col .bar-v--now { background: var(--accent); }
.col .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); }
.mix { height: 12px; display: flex; gap: 2px; }
.mix-row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.mix-row .sq { width: 10px; height: 10px; flex: none; background: var(--c); }
.mix-row b { flex: 1 1 auto; font-weight: 600; color: var(--strong); }
.mix-row span { color: var(--muted); }

/* Account */
.me { display: flex; align-items: center; gap: 16px; }
.photo-btn { position: relative; padding: 0; border: none; background: none; border-radius: 50%; }
.photo-badge { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: #FFFFFF; border: 2px solid var(--bg); }
.me-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.me-txt b { font-size: 20px; font-weight: 800; color: var(--strong); }
.me-txt span { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); }
.seg button { min-height: 44px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--strong); color: var(--bg); }
.pref { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.pref + .pref, .pref + .li, .li + .pref { border-top: 1px solid var(--border); }
.pref-line { display: flex; align-items: center; gap: 12px; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; flex: none; margin: 0; position: relative; border-radius: 16px; background: var(--off); cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: left .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 23px; }

/* Forms */
.subbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 12px 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
.subbar h1 { margin: 0; font-size: 18px; font-weight: 800; color: var(--strong); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .flabel { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--field); background: var(--surface); color: var(--strong); font-size: 16px; border-radius: 0; }
select.input { padding: 0 10px; }
textarea.input { padding: 12px 14px; min-height: 96px; resize: vertical; }
.input:disabled { background: var(--surface2); color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.phone { display: flex; gap: 8px; }
.phone select { width: 92px; flex: none; }
.help { font-size: 13px; line-height: 1.4; color: var(--faint); }
.err { font-size: 13px; font-weight: 600; color: var(--accent-text); }
.info { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); font-size: 14px; line-height: 1.4; }
.info svg { flex: none; margin-top: 1px; color: var(--muted); }
.radio { min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
.radio + .radio { border-top: 1px solid var(--border); }
.radio input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); }
.savebar { position: sticky; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
.divider { height: 1px; background: var(--border); }

/* Tab bar */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); }
.tabbar[hidden] { display: none; }
.tab { height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; border-top: 3px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.tab[aria-current="page"] { border-top-color: var(--accent); color: var(--strong); font-weight: 700; }

/* Toasts & modal */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); width: calc(100% - 32px); max-width: 448px; z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toasts--sub { bottom: calc(96px + env(safe-area-inset-bottom)); }
.toast { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; background: var(--strong); color: var(--bg); box-shadow: 0 8px 24px var(--shadow); animation: up .18s ease-out; }
.toast-top { display: flex; align-items: flex-start; gap: 10px; }
.toast-top > div { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.toast-top b { font-size: 15px; }
.toast-top span { font-size: 13px; }
.toast-x { width: 44px; height: 44px; margin: -12px -12px -12px 0; flex: none; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--bg); }
.toast-act { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--toast-line); font-size: 13px; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); }
.sheet { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; padding: 22px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); animation: up .18s ease-out; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--strong); }
.sheet p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.45; }
.sheet-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
    <button class="tab" data-action="tab" data-tab="reservar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Reservar</button>
    <button class="tab" data-action="tab" data-tab="progreso"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Mi progreso</button>
    <button class="tab" data-action="tab" data-tab="cuenta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Mi cuenta</button>
  </nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modal"></div>
  <input type="file" id="photo-input" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
</div>

<script>
/* ===== Ajustes del prototipo ===== */
const GYM_NAME = '[Nombre del gimnasio]';
const TODAY = new Date(2026, 10, 5);      // jueves 5 de noviembre de 2026

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayNum = (d) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const dow = (d) => (d.getDay() + 6) % 7;
const toMin = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };

const weekStart = (off) => addDays(BASE_MONDAY, off * 7);

const fmtDate = (s) => { const d = parseYmd(s); return d.getDate() + ' de ' + MONTHS[d.getMonth()]; };

function saveTheme(v) { try { localStorage.setItem('reservas-tema', v); } catch (e) { /* sin almacenamiento */ } }

function applyTheme() {
  const eff = state.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : state.theme;
  document.documentElement.dataset.theme = eff;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'dark' ? '#111113' : '#F4F4F1');
}

function ageOn(birth, ref) {
  const b = parseYmd(birth); let a = ref.getFullYear() - b.getFullYear();
  if (ref.getMonth() < b.getMonth() || (ref.getMonth() === b.getMonth() && ref.getDate() < b.getDate())) a--;
  return a;
}
function groupOf(p) {
  if (!p.kid) return 'adult';
  if (p.birth) { const a = ageOn(p.birth, TODAY); if (a >= 4 && a <= 8) return 'k48'; if (a >= 9 && a <= 13) return 'k913'; return null; }
  return p.group || null;
}
function planDiscs(p) { if (p.plan.type === 'all') return ['bjj', 'grappling', 'mma']; if (p.plan.type === 'kids') return ['kids']; return [p.plan.disc]; }
function planLabel(p) {
  if (p.plan.type === 'all') return 'Todas las disciplinas';
  if (p.plan.type === 'kids') { const g = groupOf(p); return 'Plan infantil · ' + (g ? GROUP[g] : 'edad fuera de rango'); }
  return 'Una disciplina · ' + DISC[p.plan.disc].name;
}
function avatar(p, size) {
  const inner = p.photo ? '<img src="' + p.photo + '" alt="">' : esc(initials(p));
  return '<span class="avatar avatar--' + size + '" aria-hidden="true">' + inner + '</span>';
}

function classesFor(p, date) {
  const g = groupOf(p); if (!g) return [];
  const discs = planDiscs(p); const key = ymd(date);
  return (SCHEDULE[dow(date)] || []).filter((c) => c.group === g && discs.includes(c.disc))
    .map((c) => ({ ...c, date: key, id: key + '|' + c.start + '|' + c.disc + '|' + c.group }));
}
function parseId(id) {
  const [date, start, disc, group] = id.split('|'); const d = parseYmd(date);
  const c = (SCHEDULE[dow(d)] || []).find((x) => x.start === start && x.disc === disc && x.group === group);
  return { id, date, start, disc, group, end: c ? c.end : '' };
}
function pseudoFree(id) { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return 6 + (h % 17); }
function freeOf(k) {
  const base = KNOWN_FREE[k.id] ?? pseudoFree(k.id);
  let booked = 0; for (const p of state.profiles) if (state.bookings[p.id] && state.bookings[p.id].has(k.id)) booked++;
  return base - (booked - (INITIAL_BOOKED.has(k.id) ? 1 : 0));
}
function statusOf(p, k) {
  const today = dayNum(TODAY), dn = dayNum(parseYmd(k.date));
  if (CANCELLED_DAYS.includes(k.date)) return 'cancelled';
  const past = dn < today || (dn === today && toMin(k.start) <= NOW_MIN);
  const att = state.attended[p.id].has(k.id);
  if (past) {
    if (p.kid) return att ? 'teacherYes' : 'teacherNo';
    if (att) return 'attended';
    return (today - dn) <= 7 ? 'past' : 'missed';
  }
  if (p.plan.until && k.date > p.plan.until) return 'expired';
  if (state.bookings[p.id].has(k.id)) return 'booked';
  return freeOf(k) <= 0 ? 'full' : 'open';
}
function daysLeft(p) { return p.plan.until ? dayNum(parseYmd(p.plan.until)) - dayNum(TODAY) : null; }

/* ===== Reservar ===== */
function viewReservar() {
  const p = prof(state.active);
  const ws = weekStart(state.week), we = addDays(ws, 6);
  const wl = ws.getMonth() === we.getMonth()
    ? 'Semana del ' + ws.getDate() + ' al ' + we.getDate() + ' de ' + MONTHS[we.getMonth()]
    : 'Semana del ' + ws.getDate() + ' de ' + MONTHS[ws.getMonth()] + ' al ' + we.getDate() + ' de ' + MONTHS[we.getMonth()];
  let h = header();
  h += '<div class="title-row"><div><h1 class="title">Reservar</h1><div class="subtitle">' + wl + '</div></div><div style="display:flex;gap:6px">' +
    '<button class="iconbtn" data-action="week" data-dir="-1" aria-label="Semana anterior"' + (state.week <= WEEK_MIN ? ' disabled' : '') + '>' + I.left + '</button>' +
    '<button class="iconbtn" data-action="week" data-dir="1" aria-label="Semana siguiente"' + (state.week >= WEEK_MAX ? ' disabled' : '') + '>' + I.right + '</button></div></div>';

  const dl = daysLeft(p);
  if (dl !== null && dl >= 0 && dl <= 7) {
    h += '<section class="banner">' + I.clock + '<div class="banner-txt"><b>' + (p.kid ? 'El plan de ' + esc(p.first) : 'Tu plan') + ' vence el ' + fmtDate(p.plan.until) + '</b><span>Renuévalo para seguir reservando</span></div><button class="btn" data-action="renew">Renovar</button></section>';
  }
  h += combo();

  h += '<div class="strip" role="group" aria-label="Días de la semana">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), dn = dayNum(d), ks = classesFor(p, d), ss = ks.map((k) => statusOf(p, k));
    const cls = ['day'];
    if (dn < dayNum(TODAY)) cls.push('is-past');
    if (dn === dayNum(TODAY)) cls.push('is-today');
    if (i === state.day) cls.push('is-sel');
    let mark = 'mark', lab = dayLabel(d);
    if (dn === dayNum(TODAY)) lab += ', hoy';
    if (ss.includes('booked')) { mark += ' mark--booked'; lab += ', con reserva'; }
    else if (ss.includes('attended') || ss.includes('teacherYes')) { mark += ' mark--att'; lab += ', con asistencia'; }
    else if (ss.length && ss.every((s) => s === 'cancelled')) { mark += ' mark--off'; lab += ', clases canceladas'; }
    h += '<button class="' + cls.join(' ') + '" data-action="day" data-i="' + i + '" aria-pressed="' + (i === state.day) + '" aria-label="' + lab + '"><span class="dl">' + DAY_LETTERS[i] + '</span><span class="dn">' + d.getDate() + '</span><span class="' + mark + '"></span></button>';
  }
  h += '</div>';

  const d = addDays(ws, state.day), dn = dayNum(d), ks = classesFor(p, d);
  h += '<section class="daycard" id="daycard" aria-label="' + dayLabel(d) + '"><div class="dayhead"><h2 class="h2">' + dayLabel(d) + '</h2>' + (dn === dayNum(TODAY) ? '<span class="badge">Hoy</span>' : '') + '</div>';
  const ss = ks.map((k) => statusOf(p, k));
  if (ss.some((s) => ['past', 'attended', 'teacherYes', 'teacherNo', 'missed'].includes(s))) {
    h += '<div class="hint">' + (p.kid ? 'En las clases infantiles, la asistencia la marca el profesor al pasar lista.' : 'Marca las clases a las que fuiste en los últimos 7 días. Cuentan para tu progreso.') + '</div>';
  }
  if (!groupOf(p)) h += '<div class="empty">Añade la fecha de nacimiento de ' + esc(p.first) + ' para ver sus clases.</div>';
  else if (!ks.length) h += '<div class="empty">' + (p.plan.type === 'all' ? 'No hay clases este día' : 'No hay clases de ' + DISC[planDiscs(p)[0]].name + ' este día') + '</div>';
  ks.forEach((k, i) => { h += rowHtml(p, k, ss[i]); });
  h += '</section>';
  return h;
}
function rowHtml(p, k, s) {
  const cancelled = s === 'cancelled';
  const hl = ['booked', 'attended', 'teacherYes'].includes(s);
  const free = freeOf(k);
  let cap = '';
  if (s === 'open' || s === 'booked') cap = free <= 5 ? '<span class="cap cap--low">Solo quedan ' + free + '</span>' : '<span class="cap">' + free + ' plazas libres</span>';
  if (s === 'full') cap = '<span class="cap cap--low">Clase completa</span>';
  const canUndo = (dayNum(TODAY) - dayNum(parseYmd(k.date))) <= 7;
  let act = '';
  switch (s) {
    case 'open': act = '<button class="btn" data-action="book" data-id="' + k.id + '">Reservar</button>'; break;
    case 'booked': act = '<span class="done">' + I.check + 'Reservada</span><button class="linkbtn" data-action="cancel" data-id="' + k.id + '">Cancelar reserva</button>'; break;
    case 'full': act = '<span class="chip">Completa</span>'; break;
    case 'expired': act = '<button class="btn btn--outline" data-action="renew">Renovar</button><span class="small">Tu plan acaba el ' + fmtDate(p.plan.until).replace(' de ', ' ') + '</span>'; break;
    case 'cancelled': act = '<span class="chip">Cancelada</span>'; break;
    case 'past': act = '<button class="btn btn--outline" data-action="attend" data-id="' + k.id + '">Estuve aquí</button>'; break;
    case 'attended': act = '<span class="done">' + I.check + 'Asististe</span>' + (canUndo ? '<button class="linkbtn linkbtn--muted" data-action="unattend" data-id="' + k.id + '">Deshacer</button>' : ''); break;
    case 'teacherYes': act = '<span class="done">' + I.check + 'Asistió</span><span class="small">Lista del profesor</span>'; break;
    case 'teacherNo': act = '<span class="muted-txt">No asistió</span>'; break;
    case 'missed': act = '<span class="muted-txt">No asististe</span>'; break;
  }
  return '<article class="row' + (hl ? ' row--hl' : '') + '"><div class="row-time"><span class="t1' + (cancelled ? ' is-off' : '') + '">' + k.start + '</span><span class="t2">' + k.end + '</span></div>' +
    '<div class="row-info"><div class="row-name"><span class="dot" style="--c:' + (cancelled ? 'var(--faint)' : 'var(--' + k.disc + ')') + '"></span><span class="nm' + (cancelled ? ' is-off is-strike' : '') + '">' + DISC[k.disc].name + '</span></div>' +
    '<span class="meta">' + GROUP[k.group] + ' · 60 min</span>' + cap + '</div><div class="row-act">' + act + '</div></article>';
}

/* ===== Mi progreso ===== */
function attendedList(p) {
  return [...state.attended[p.id]].map(parseId).sort((a, b) => (b.date + b.start).localeCompare(a.date + a.start));
}
function countsByDisc(p) {
  const c = {}; planDiscs(p).forEach((d) => { c[d] = 0; });
  attendedList(p).forEach((k) => { c[k.disc] = (c[k.disc] || 0) + 1; });
  Object.values(state.legacy[p.id] || {}).forEach((m) => { for (const d in m) c[d] = (c[d] || 0) + m[d]; });
  return c;
}
function viewProgreso() {
  const p = prof(state.active);
  const counts = countsByDisc(p);
  const discs = planDiscs(p);
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  let h = header();
  h += '<div><h1 class="title">Mi progreso</h1><div class="subtitle">' + (p.kid ? esc(p.first) + ' lleva ' : '') + total + (total === 1 ? ' clase' : ' clases') + ' en total</div></div>';
  h += combo();
  const multi = discs.length > 1;
  h += '<section class="group" aria-label="Disciplinas"><div class="car-head"><h2 class="label">Disciplinas</h2>' + (multi ? '<span class="small" id="car-count">' + (state.carIdx + 1) + ' de ' + discs.length + ' · desliza</span>' : '') + '</div>';
  h += '<div class="car' + (multi ? '' : ' car--single') + '" id="car">';
  discs.forEach((d) => {
    const info = DISC[d], n = counts[d] || 0;
    h += '<article aria-label="' + info.long + '"><div class="car-head"><span class="disc-name"><span class="dot" style="--c:var(--' + d + ')"></span>' + info.long + '</span><span class="small">' + n + (n === 1 ? ' clase' : ' clases') + '</span></div>';
    if (info.graded) {
      const stripes = 0, pct = Math.min(100, (n / info.need) * 100);

/* ===== Render ===== */
let lastKey = '';
function render() {
  applyTheme();
  const view = $('#view'); const isSub = !!state.sub;
  const key = state.sub ? state.sub + ':' + (state.subArg || '') : state.tab + ':' + state.active;
  const car = $('#car'); const carLeft = car ? car.scrollLeft : 0;
  let html = '';
  if (state.sub === 'datos') html = viewDatos();
  else if (state.sub === 'emergencia') html = viewEmergencia();
  else if (state.sub === 'hijo') html = viewHijo(state.subArg);
  else if (state.sub === 'nuevo') html = viewNuevo();
  else if (state.sub === 'historial') html = viewHistorial();
  else if (state.tab === 'progreso') html = viewProgreso();
  else if (state.tab === 'cuenta') html = viewCuenta();
  else html = viewReservar();
  view.className = 'view' + (isSub ? ' view--sub' : '');
  view.innerHTML = html;
  $('#tabbar').hidden = isSub;
  $('#toasts').className = 'toasts' + (isSub ? ' toasts--sub' : '');
  document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.tab === state.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if (key !== lastKey) { window.scrollTo(0, 0); state.carIdx = key.startsWith('progreso') && lastKey === key ? state.carIdx : 0; }
  const nc = $('#car');
  if (nc) {
    if (key === lastKey) nc.scrollLeft = carLeft;
    nc.addEventListener('scroll', onCarScroll, { passive: true });
  }
  const dc = $('#daycard'); if (dc) bindSwipe(dc);
  lastKey = key;
}
function onCarScroll(e) {
  const el = e.currentTarget; const first = el.firstElementChild; if (!first) return;
  const step = first.getBoundingClientRect().width + 12;
  const i = Math.max(0, Math.min(el.children.length - 1, Math.round(el.scrollLeft / step)));
  if (i === state.carIdx) return;
  state.carIdx = i;
  const c = $('#car-count'); if (c) c.textContent = (i + 1) + ' de ' + el.children.length + ' · desliza';
  document.querySelectorAll('#pips .pip').forEach((p, j) => p.classList.toggle('pip--on', j === i));
}
function bindSwipe(el) {
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    moveDay(dx < 0 ? 1 : -1);
  });
}
function moveDay(dir) {
  let d = state.day + dir, w = state.week;
  if (d > 6) { if (w >= WEEK_MAX) return; d = 0; w++; }
  if (d < 0) { if (w <= WEEK_MIN) return; d = 6; w--; }
  state.day = d; state.week = w; render();
}

  const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = '<div class="toast-top">' + I.check + '<div><b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</div><button class="toast-x" aria-label="Cerrar aviso">' + I.x + '</button></div>' +
    (opt.notif ? '<div class="toast-act"><span>¿Te avisamos si se cancela o cambia?</span><button class="btn" data-toast-notif>Activar avisos</button></div>' : '');
  const close = () => el.remove();
  el.querySelector('.toast-x').addEventListener('click', close);
  const nb = el.querySelector('[data-toast-notif]');
  if (nb) nb.addEventListener('click', () => { state.notif = true; close(); toast('Avisos activados', 'Te avisaremos si cambia una clase reservada.'); });
  box.innerHTML = ''; box.appendChild(el);
  setTimeout(close, opt.notif ? 9000 : 4000);
}
function confirmSheet({ title, text, ok, cancel = 'Volver', danger = true }) {
  return new Promise((resolve) => {
    const root = $('#modal'); const prev = document.activeElement;
    root.innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') +
      '<div class="sheet-btns"><button class="btn btn--big" data-r="1"' + (danger ? '' : '') + '>' + esc(ok) + '</button><button class="btn btn--outline btn--big" data-r="0">' + esc(cancel) + '</button></div></div></div>';
    const done = (v) => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    root.querySelector('.overlay').addEventListener('click', (e) => { if (e.target.classList.contains('overlay')) done(false); });
    root.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => done(b.dataset.r === '1')));
    root.querySelector('[data-r="0"]').focus();
  });
}

/* ===== Acciones ===== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (state.comboOpen && !e.target.closest('.combo-wrap')) { state.comboOpen = false; if (!el) { render(); return; } }
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const p = prof(state.active);
  switch (a) {
    case 'tab': state.tab = el.dataset.tab; state.sub = null; state.comboOpen = false; render(); break;
    case 'combo': state.comboOpen = !state.comboOpen; render(); if (state.comboOpen) { const o = $('.opt[aria-selected="true"]'); if (o) o.focus(); } break;
    case 'pick': state.active = id; state.comboOpen = false; render(); $('.combo') && $('.combo').focus(); break;
    case 'week': state.week = Math.max(WEEK_MIN, Math.min(WEEK_MAX, state.week + Number(el.dataset.dir))); state.day = state.week === 0 ? dow(TODAY) : 0; render(); break;
    case 'day': state.day = Number(el.dataset.i); render(); break;
    case 'book': {
      const k = parseId(id); state.bookings[p.id].add(id); render();
      toast('Reserva confirmada', 'Para ' + p.first + ' · ' + DISC[k.disc].name + ', ' + shortDay(parseYmd(k.date)) + ' a las ' + k.start, { notif: !state.notif });
      break;
    }
    case 'cancel': {
      const k = parseId(id);
      const ok = await confirmSheet({ title: '¿Cancelar la reserva?', text: DISC[k.disc].name + ' de ' + p.first + ', ' + dayLabel(parseYmd(k.date)).toLowerCase() + ' a las ' + k.start + '. La plaza quedará libre para otra persona.', ok: 'Cancelar reserva' });
      if (ok) { state.bookings[p.id].delete(id); render(); toast('Reserva cancelada', DISC[k.disc].name + ', ' + shortDay(parseYmd(k.date)) + ' a las ' + k.start); }
      break;
    }
    case 'attend': state.attended[p.id].add(id); render(); toast('Asistencia guardada', 'Suma para tu próximo grado.'); break;
    case 'unattend': state.attended[p.id].delete(id); render(); break;
    case 'go': state.sub = el.dataset.sub; state.subArg = id || null; render(); break;
    case 'back': {
      const from = state.sub; state.sub = null; state.subArg = null;
      if (from === 'historial') state.tab = 'progreso'; else state.tab = 'cuenta';
      render(); break;
    }
    case 'theme': state.theme = el.dataset.val; saveTheme(state.theme); render(); break;
    case 'renew': toast('Renovación', 'En el prototipo no se hacen pagos. Aquí se abriría el pago del plan.'); break;
    case 'logout': if (await confirmSheet({ title: '¿Cerrar sesión?', text: 'Tendrás que volver a entrar con tu correo para reservar.', ok: 'Cerrar sesión' })) toast('Sesión cerrada', 'En el prototipo puedes seguir navegando.'); break;
    case 'photo': { const inp = $('#photo-input'); inp.dataset.for = id; inp.value = ''; inp.click(); break; }
    case 'unphoto': { const t = prof(id); if (t) { t.photo = null; render(); toast('Foto quitada', ''); } break; }
    case 'delkid': {
      const k = prof(id); if (!k) break;
      const ok = await confirmSheet({ title: '¿Eliminar el perfil de ' + k.first + '?', text: 'Se borrarán sus reservas y su progreso de este móvil. Esta acción no se puede deshacer.', ok: 'Eliminar perfil' });
      if (ok) {
        state.profiles = state.profiles.filter((x) => x.id !== id);
        delete state.bookings[id]; delete state.attended[id]; delete state.legacy[id];
        if (state.active === id) state.active = owner().id;
        state.sub = null; state.tab = 'cuenta'; render(); toast('Perfil eliminado', '');
      }
      break;
    }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'notif') { state.notif = t.checked; toast(t.checked ? 'Avisos activados' : 'Avisos desactivados', ''); }
  if (t.id === 'lang' && t.value !== 'Español') { t.value = 'Español'; toast('Idioma', 'En el prototipo solo está disponible el español.'); }
  if (t.name === 'emode') { const f = $('#other-fields'); if (f) f.style.display = t.value === 'other' ? 'flex' : 'none'; }
  if (t.id === 'photo-input' && t.files && t.files[0]) {
    const target = prof(t.dataset.for); const r = new FileReader();
    r.onload = () => { if (target) { target.photo = r.result; render(); toast('Foto actualizada', ''); } };
    r.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.comboOpen) { state.comboOpen = false; render(); $('.combo') && $('.combo').focus(); }
});
function formErr(msg) { const el = $('#form-err'); if (el) { el.textContent = msg; el.hidden = false; el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), v = (n) => String(fd.get(n) || '').trim();
  if (f.dataset.form === 'datos') {
    if (!v('first') || !v('last')) return formErr('Escribe tu nombre y apellidos.');
    Object.assign(owner(), { first: v('first'), last: v('last'), birth: v('birth'), gender: v('gender'), country: v('country'), prefix: v('prefix'), phone: v('phone') });
    state.sub = null; state.tab = 'cuenta'; render(); toast('Cambios guardados', '');
  }
  if (f.dataset.form === 'emergencia') {
    if (!v('name') || !v('phone')) return formErr('Escribe el nombre y el teléfono del contacto.');
    owner().emergency = { name: v('name'), rel: v('rel'), prefix: v('prefix'), phone: v('phone') };
    state.sub = null; state.tab = 'cuenta'; render(); toast('Cambios guardados', '');
  }
  if (f.dataset.form === 'hijo') {
    const k = prof(f.dataset.id); if (!k) return;
    if (!v('first') || !v('last')) return formErr('Escribe su nombre y apellidos.');
    if (v('birth')) { const a = ageOn(v('birth'), TODAY); if (a < 4 || a > 13) return formErr('Con ' + a + ' años no entra en las clases infantiles (de 4 a 13 años).'); }
    const mode = v('emode') || 'parent';
    if (mode === 'other' && (!v('ename') || !v('ephone'))) return formErr('Escribe el nombre y el teléfono del contacto de emergencia.');
    Object.assign(k, { first: v('first'), last: v('last'), birth: v('birth'), medical: v('medical'), imageOk: fd.get('imageOk') === 'on', emergencyMode: mode,
      emergency: { name: v('ename'), rel: v('erel'), prefix: v('eprefix'), phone: v('ephone') } });
    state.sub = null; state.tab = 'cuenta'; render(); toast('Cambios guardados', 'Perfil de ' + k.first + ' actualizado.');
  }
  if (f.dataset.form === 'nuevo') {
    if (!v('first') || !v('last')) return formErr('Escribe su nombre y apellidos.');
    if (!v('birth')) return formErr('Indica su fecha de nacimiento para asignarle grupo.');
    const a = ageOn(v('birth'), TODAY);
    if (a < 4 || a > 13) return formErr('Con ' + a + ' años no entra en las clases infantiles (de 4 a 13 años).');
    const id = 'k' + Date.now();
    state.profiles.push({ id, first: v('first'), last: v('last'), kid: true, birth: v('birth'), photo: null, plan: { type: 'kids', name: 'Infantil', until: null },
      emergencyMode: 'parent', emergency: { name: '', rel: 'Madre', prefix: '+34', phone: '' }, medical: '', imageOk: false });
    state.bookings[id] = new Set(); state.attended[id] = new Set(); state.legacy[id] = {};
    state.sub = null; state.tab = 'cuenta'; render(); toast('Perfil añadido', v('first') + ' ya aparece en el selector de perfil.');
  }
});

render();
</script>
